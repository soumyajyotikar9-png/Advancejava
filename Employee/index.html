<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
    @page {
        size: A4;
        margin: 0;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #e9e9e9;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        width: 210mm;
        min-height: 297mm;
        margin: 0 auto;
        padding: 100mm 32mm 0;
        background: #ffffff;
        text-align: center;
    }

    h1 {
        margin: 0;
        color: #000000;
        font-size: 25pt;
        font-weight: 700;
        line-height: 1.2;
    }

    p {
        margin: 6mm 0 12mm;
        color: #444444;
        font-size: 14pt;
    }

    .buttons {
        display: flex;
        flex-direction: column;
        gap: 5mm;
    }

    .btn {
        display: block;
        padding: 5.5mm;
        border-radius: 2mm;
        background: #0d67ed;
        color: #ffffff;
        font-size: 14pt;
        text-decoration: none;
    }

    .btn:hover {
        background: #0759d0;
    }

    @media print {
        body {
            background: #ffffff;
        }

        .container {
            margin: 0;
        }
    }

    @media screen and (max-width: 210mm) {
        .container {
            width: 100%;
            min-height: 100vh;
            padding: 32vh 8vw 0;
        }

        h1 {
            font-size: clamp(24px, 7vw, 38px);
        }

        p,
        .btn {
            font-size: clamp(16px, 4vw, 21px);
        }
    }
</style>
</head>

<body>
    <div class="container">
        <h1>
            Employee Management System
        </h1>
        <p>
            Manage employee records easily
        </p>
        <div class="buttons">
            <a href="Add.html" class="btn">Add Employee</a>
            <a href="ViewServlet" class="btn">View Employee</a>
            <a href="update.html" class="btn">Update Employee</a>
            <a href="delete.html" class="btn">Delete Employee</a>
        </div>
    </div>
</body>

</html>
